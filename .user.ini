; =================================================================
; ÁNGELES DE VIDA — .user.ini (configuración de PHP para HostGator / cPanel)
; Por defecto PHP solo acepta archivos de 2 MB; la hoja de vida puede
; pesar hasta 10 MB (aplicar.php). Se deja algo de margen:
;   upload_max_filesize = tamaño máximo de UN archivo subido
;   post_max_size       = tamaño máximo de TODO el envío (archivo + campos)
; Si el servidor no aplicara estos valores (diagnostico.php lo indica), se cambian en
; cPanel → Editor INI de MultiPHP (o "Seleccionar versión de PHP" → Opciones).
; =================================================================
upload_max_filesize = 12M
post_max_size = 16M
max_execution_time = 60
